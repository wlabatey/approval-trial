name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency on purpose: a run waiting for production
# approval would hold the group and block the next run's staging stage.

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - run: echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA"

  staging-a:
    needs: [changes]
    uses: ./.github/workflows/staging.yml
    with: { service: a, sleep: 45 }

  staging-b:
    needs: [changes]
    uses: ./.github/workflows/staging.yml
    with: { service: b, sleep: 5 }

  staging-complete:
    needs: [staging-a, staging-b]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Move staging tags
        run: |
          set -euo pipefail
          echo "staging-a=${{ needs.staging-a.result }} staging-b=${{ needs.staging-b.result }}"
          git push --force origin "HEAD:refs/tags/staging/a" "HEAD:refs/tags/staging/b"

  supersede:
    needs: [staging-complete]
    if: ${{ !cancelled() && needs.staging-complete.result == 'success' && vars.SUPERSEDE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Cancel every other run whose production stage has not started
        run: |
          set -euo pipefail
          wf="${WORKFLOW_REF%@*}"; wf="${wf##*/}"
          echo "workflow file: $wf"
          # Sweep every other unfinished run of this workflow on main. A run past
          # staging whose production jobs are waiting (approval) or pending
          # (queued behind a waiting run's concurrency group) is superseded by
          # this one. A run with a production job in progress is an approved
          # deploy and is never touched. A run still in staging is left alone:
          # it will run its own sweep when it gets here.
          gh run list --workflow "$wf" --branch main --limit 50 --json databaseId,number,status \
            | jq -r --argjson me "$RUN_ID" \
                '.[] | select(.status != "completed" and .databaseId != $me) | "\(.databaseId) \(.number) \(.status)"' \
            | while read -r id number status; do
                jobs="$(gh run view "$id" --json jobs --jq '.jobs')"
                staging_done="$(jq -r '[.[] | select(.name == "staging-complete" and .status == "completed")] | length' <<<"$jobs")"
                prod_running="$(jq -r '[.[] | select((.name | startswith("production")) and .status == "in_progress")] | length' <<<"$jobs")"
                if [ "$staging_done" = "0" ]; then
                  echo "Run #$number ($id, $status): still in staging; leaving it"
                elif [ "$prod_running" != "0" ]; then
                  echo "Run #$number ($id, $status): production in progress; leaving it"
                else
                  echo "Cancelling run #$number ($id, $status): superseded by #$RUN_NUMBER"
                  gh run cancel "$id"
                  echo "cancelled #$number ($status)" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
          echo "done"

  production-a:
    needs: [changes, staging-complete, supersede]
    if: ${{ !cancelled() && needs.staging-complete.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.supersede.result) }}
    uses: ./.github/workflows/production.yml
    with: { service: a, timeout: 60 }

  production-b:
    needs: [changes, staging-complete, supersede]
    if: ${{ !cancelled() && needs.staging-complete.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.supersede.result) }}
    uses: ./.github/workflows/production.yml
    with: { service: b, timeout: 2 }

  production-matrix:
    needs: [changes, staging-complete, supersede]
    if: ${{ !cancelled() && needs.staging-complete.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.supersede.result) }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        name: [x, y, z]
    concurrency:
      group: production-matrix-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - run: echo "matrix ${{ matrix.name }} deployed"

  production-late:
    needs: [production-a]
    # Explicit guard: the implicit success() is poisoned by the skipped
    # `supersede` job upstream (transitive skip), which is why this job was
    # skipped in run 1.
    if: ${{ !cancelled() && needs.production-a.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "late job (second approval?)"

  production-complete:
    needs: [production-a, production-b, production-matrix, production-late]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Move prod tags and summarise
        run: |
          set -euo pipefail
          {
            echo "## Production results"
            echo "- a: ${{ needs.production-a.result }}"
            echo "- b: ${{ needs.production-b.result }}"
            echo "- matrix: ${{ needs.production-matrix.result }}"
            echo "- late: ${{ needs.production-late.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.production-a.result }}" = success ] && git push --force origin "HEAD:refs/tags/prod/a" || true
          [ "${{ needs.production-b.result }}" = success ] && git push --force origin "HEAD:refs/tags/prod/b" || true
